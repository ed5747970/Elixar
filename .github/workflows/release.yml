# Push a tag like v1.8.0 -> build, self-test, (optionally) code-sign, package, sign the update manifest and publish a GitHub release.
# Elixar's "Check for updates" installs a release only when its manifest is signed with the ELIXAR_SIGNING_KEY secret.
name: Release
on:
  push:
    tags: [ 'v*' ]
  # or by hand: Actions > Release > Run workflow, with the version (for example 1.2.52); the tag is made from main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.2.52 (with or without v) (must match AssemblyVersion in src/CDriveCleaner.cs)"
        required: true
permissions:
  contents: write
env:
  # typed as 1.2.52 or v1.2.52: the tag is always v1.2.52
  TAG: ${{ github.event_name == 'workflow_dispatch' && (startsWith(github.event.inputs.version, 'v') && github.event.inputs.version || format('v{0}', github.event.inputs.version)) || github.ref_name }}
jobs:
  release:
    # the "release" environment: in Settings > Environments it can require your approval before the signing key is used
    environment: release
    runs-on: windows-latest
    env:
      HAS_PFX: ${{ secrets.CODESIGN_PFX != '' }}
      HAS_ESIGNER: ${{ secrets.ES_USERNAME != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2, pinned to its commit
        with:
          persist-credentials: false   # the job's token isn't left in .git/config for later steps
      - name: Build and run the self-test (both editions)
        shell: powershell
        run: .\build.ps1 -SelfTest
        env:
          ELIXAR_GOOGLE_ID: ${{ secrets.ELIXAR_GOOGLE_ID }}
          ELIXAR_GOOGLE_SECRET: ${{ secrets.ELIXAR_GOOGLE_SECRET }}
          ELIXAR_MS_ID: ${{ secrets.ELIXAR_MS_ID }}
          ELIXAR_SPONSOR: ${{ vars.ELIXAR_SPONSOR }}
      # Code signing, one of two ways (nothing happens until one is set up in Settings > Secrets and variables > Actions):
      #  a) SSL.com eSigner (cloud signing; certificates bought since 2023 can't be exported as a .pfx):
      #     secrets ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID, ES_TOTP_SECRET
      #  b) a .pfx file: secrets CODESIGN_PFX (base64) and CODESIGN_PASSWORD
      - name: Code-sign the programs with a .pfx (only when one is set up)
        if: env.HAS_PFX == 'true'
        env:
          CODESIGN_PFX: ${{ secrets.CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        shell: powershell
        run: |
          foreach ($e in "out\Elixar.exe", "out\business\Elixar.exe", "out\business\CureAgent.exe", "out\business\CureServer.exe") { .\tools\sign-exe.ps1 -Exe $e }
      - name: Gather the programs for SSL.com eSigner
        if: env.HAS_ESIGNER == 'true'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force sign\exe, sign\exe-signed | Out-Null
          Copy-Item out\Elixar.exe sign\exe\Private-Elixar.exe
          Copy-Item out\business\Elixar.exe sign\exe\Business-Elixar.exe
          Copy-Item out\business\CureAgent.exe, out\business\CureServer.exe sign\exe
      - name: Code-sign the programs with SSL.com eSigner
        if: env.HAS_ESIGNER == 'true'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b   # v1.3.2, pinned to its commit
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}\sign\exe
          output_path: ${{ github.workspace }}\sign\exe-signed
          malware_block: true
          environment_name: PROD
      - name: Put the signed programs back (and check every signature)
        if: env.HAS_ESIGNER == 'true'
        shell: powershell
        run: |
          Copy-Item sign\exe-signed\Private-Elixar.exe out\Elixar.exe -Force
          Copy-Item sign\exe-signed\Business-Elixar.exe out\business\Elixar.exe -Force
          Copy-Item sign\exe-signed\CureAgent.exe, sign\exe-signed\CureServer.exe out\business -Force
          foreach ($e in "out\Elixar.exe", "out\business\Elixar.exe", "out\business\CureAgent.exe", "out\business\CureServer.exe") {
            $s = Get-AuthenticodeSignature $e
            if ($s.Status -ne 'Valid') { throw "$e is not signed correctly: $($s.Status) $($s.StatusMessage)" }
            Write-Host "$e signed by $($s.SignerCertificate.Subject)"
          }
      - name: Package (Elixar for Private and Elixar for Business)
        shell: powershell
        run: |
          $v = (Get-Item out\Elixar.exe).VersionInfo.FileVersion
          $tag = "$env:TAG".TrimStart('v')
          if (-not $v.StartsWith($tag)) { throw "Tag $tag does not match the version in the code ($v). Change AssemblyVersion in src\CDriveCleaner.cs." }
          function Pack($name, $edition, $files, $zip, $manifest) {
            $pkg = "pkg\$name"
            New-Item -ItemType Directory -Force $pkg, "$pkg\source" | Out-Null
            Copy-Item $files $pkg
            Copy-Item package\README.txt, "package\Run self-test (safe).bat", guide\UserGuide.html, LICENSE $pkg
            Copy-Item -Recurse src, guide, tools, package, cure, audit-reports, app.ico, app.manifest, brand.png, build.ps1, README.md, LICENSE, SECURITY.md, ANTIVIRUS.md, update-key.pub.xml "$pkg\source"
            $exe = Join-Path $pkg "Elixar.exe"
            # the Group Policy / Intune template, made by this build (both editions have Policy manager)
            $p = Start-Process $exe -ArgumentList '--admx', "`"$((Resolve-Path $pkg).Path)\PolicyDefinitions`"" -Wait -PassThru
            if ($p.ExitCode -ne 0 -or -not (Test-Path "$pkg\PolicyDefinitions\en-US\Elixar.adml")) { throw "Could not make the Group Policy template" }
            $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash
            $sums = Get-ChildItem $pkg -Filter *.exe | ForEach-Object { "$($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" }
            [IO.File]::WriteAllText("$pkg\SHA256.txt", "Elixar for $(if ($edition -eq 'business') {'Business'} else {'Private'}) $v - made by Elisar`r`nSHA-256:`r`n" + ($sums -join "`r`n") + "`r`n")
            Compress-Archive -Path $pkg -DestinationPath $zip -Force
            $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash
            [IO.File]::WriteAllText($manifest, "version=$v`nzip-sha256=$zipHash`nexe-sha256=$exeHash`nedition=$edition`n", (New-Object Text.UTF8Encoding $false))
          }
          Pack "Elixar" "private" @("out\Elixar.exe") "Elixar.zip" "elixar-manifest.txt"
          Pack "Elixar-Business" "business" @("out\business\Elixar.exe", "out\business\CureAgent.exe", "out\business\CureServer.exe") "Elixar-Business.zip" "elixar-business-manifest.txt"
      - name: Build the MSIs for IT (Intune, Group Policy, SCCM)
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          $v = (Get-Item out\Elixar.exe).VersionInfo.FileVersion
          $v3 = ($v.Split('.')[0..2]) -join '.'
          Copy-Item package\Elixar.wxs Elixar4.wxs; Copy-Item package\Elixar-Business.wxs ElixarBiz4.wxs
          wix convert Elixar4.wxs; wix convert ElixarBiz4.wxs; $global:LASTEXITCODE = 0
          wix build -arch x64 -d Version=$v3 -d Exe=out\Elixar.exe -o Elixar.msi Elixar4.wxs
          wix build -arch x64 -d Version=$v3 -d Exe=out\business\Elixar.exe -d Agent=out\business\CureAgent.exe -d Server=out\business\CureServer.exe -o Elixar-Business.msi ElixarBiz4.wxs
      - name: Gather the MSIs for SSL.com eSigner
        if: env.HAS_ESIGNER == 'true' && hashFiles('Elixar.msi', 'Elixar-Business.msi') != ''
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force sign\msi, sign\msi-signed | Out-Null
          foreach ($m in "Elixar.msi", "Elixar-Business.msi") { if (Test-Path $m) { Copy-Item $m sign\msi } }
      - name: Code-sign the MSIs with SSL.com eSigner
        if: env.HAS_ESIGNER == 'true' && hashFiles('Elixar.msi', 'Elixar-Business.msi') != ''
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b   # v1.3.2, pinned to its commit
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}\sign\msi
          output_path: ${{ github.workspace }}\sign\msi-signed
          malware_block: true
          environment_name: PROD
      - name: Put the signed MSIs back
        if: env.HAS_ESIGNER == 'true' && hashFiles('Elixar.msi', 'Elixar-Business.msi') != ''
        shell: powershell
        run: |
          foreach ($m in "Elixar.msi", "Elixar-Business.msi") {
            if (Test-Path "sign\msi-signed\$m") {
              Copy-Item "sign\msi-signed\$m" $m -Force
              $s = Get-AuthenticodeSignature $m
              if ($s.Status -ne 'Valid') { throw "$m is not signed correctly: $($s.Status)" }
            }
          }
      - name: Sign the update manifests
        env:
          ELIXAR_SIGNING_KEY: ${{ secrets.ELIXAR_SIGNING_KEY }}
        shell: pwsh
        run: |
          if (-not $env:ELIXAR_SIGNING_KEY) { Write-Warning "No ELIXAR_SIGNING_KEY secret: this release can't be installed by Elixar's updater (people download it by hand)."; exit 0 }
          $rsa = [System.Security.Cryptography.RSA]::Create()
          $rsa.FromXmlString($env:ELIXAR_SIGNING_KEY)
          foreach ($m in "elixar-manifest", "elixar-business-manifest") {
            $sig = $rsa.SignData([IO.File]::ReadAllBytes("$m.txt"), [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)
            [IO.File]::WriteAllText("$m.sig", [Convert]::ToBase64String($sig))
          }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = @("Elixar.zip", "elixar-manifest.txt", "Elixar-Business.zip", "elixar-business-manifest.txt")
          foreach ($f in "elixar-manifest.sig", "elixar-business-manifest.sig", "Elixar.msi", "Elixar-Business.msi") { if (Test-Path $f) { $files += $f } }
          gh release create "$env:TAG" @files --title "Elixar $env:TAG" --target "${{ github.sha }}" --generate-notes
