# Push a tag like v1.8.0 -> build, self-test, (optionally) code-sign, package, sign the update manifest and publish a GitHub release.
# Elixar's "Check for updates" installs a release only when its manifest is signed with the ELIXAR_SIGNING_KEY secret.
name: Release
on:
  push:
    tags: [ 'v*' ]
  # or by hand: Actions > Release > Run workflow, with the version (for example 1.2.52); the tag is made from main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.2.52 (with or without v) (must match AssemblyVersion in src/CDriveCleaner.cs)"
        required: true
permissions:
  contents: write
env:
  # typed as 1.2.52 or v1.2.52: the tag is always v1.2.52
  TAG: ${{ github.event_name == 'workflow_dispatch' && (startsWith(github.event.inputs.version, 'v') && github.event.inputs.version || format('v{0}', github.event.inputs.version)) || github.ref_name }}
jobs:
  release:
    # the "release" environment: in Settings > Environments it can require your approval before the signing key is used
    environment: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2, pinned to its commit
      - name: Build and run the self-test
        shell: powershell
        run: .\build.ps1 -SelfTest
        env:
          ELIXAR_GOOGLE_ID: ${{ secrets.ELIXAR_GOOGLE_ID }}
          ELIXAR_GOOGLE_SECRET: ${{ secrets.ELIXAR_GOOGLE_SECRET }}
          ELIXAR_MS_ID: ${{ secrets.ELIXAR_MS_ID }}
          ELIXAR_SPONSOR: ${{ vars.ELIXAR_SPONSOR }}
      - name: Code-sign Elixar.exe (only when a certificate is set up)
        if: env.CODESIGN_PFX != ''
        env:
          CODESIGN_PFX: ${{ secrets.CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        shell: powershell
        run: .\tools\sign-exe.ps1 -Exe out\Elixar.exe
      - name: Package
        shell: powershell
        run: |
          $v = (Get-Item out\Elixar.exe).VersionInfo.FileVersion
          $tag = "$env:TAG".TrimStart('v')
          if (-not $v.StartsWith($tag)) { throw "Tag $tag does not match the version in the code ($v). Change AssemblyVersion in src\CDriveCleaner.cs." }
          $pkg = "pkg\Elixar"
          New-Item -ItemType Directory -Force $pkg, "$pkg\source" | Out-Null
          Copy-Item out\Elixar.exe, package\README.txt, "package\Run self-test (safe).bat", guide\UserGuide.html $pkg
          Copy-Item -Recurse src, guide, tools, package, audit-reports, app.ico, app.manifest, brand.png, build.ps1, README.md, LICENSE, SECURITY.md, update-key.pub.xml "$pkg\source"
          Copy-Item LICENSE $pkg
          # the Group Policy / Intune template, made by this build of Elixar
          $p = Start-Process out\Elixar.exe -ArgumentList '--admx', "`"$((Resolve-Path $pkg).Path)\PolicyDefinitions`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$pkg\PolicyDefinitions\en-US\Elixar.adml")) { throw "Could not make the Group Policy template" }
          $exeHash = (Get-FileHash out\Elixar.exe -Algorithm SHA256).Hash
          [IO.File]::WriteAllText("$pkg\SHA256.txt", "Elixar $v - made by Elisar`r`nSHA-256 of Elixar.exe:`r`n$exeHash`r`n")
          Compress-Archive -Path $pkg -DestinationPath Elixar.zip -Force
          $zipHash = (Get-FileHash Elixar.zip -Algorithm SHA256).Hash
          [IO.File]::WriteAllText("elixar-manifest.txt", "version=$v`nzip-sha256=$zipHash`nexe-sha256=$exeHash`n", (New-Object Text.UTF8Encoding $false))
      - name: Build the MSI for IT (Intune, Group Policy, SCCM)
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          Copy-Item package\Elixar.wxs Elixar4.wxs
          wix convert Elixar4.wxs; $global:LASTEXITCODE = 0
          $v = (Get-Item out\Elixar.exe).VersionInfo.FileVersion
          $v3 = ($v.Split('.')[0..2]) -join '.'
          wix build -arch x64 -d Version=$v3 -d Exe=out\Elixar.exe -o Elixar.msi Elixar4.wxs
      - name: Sign the update manifest
        env:
          ELIXAR_SIGNING_KEY: ${{ secrets.ELIXAR_SIGNING_KEY }}
        shell: pwsh
        run: |
          if (-not $env:ELIXAR_SIGNING_KEY) { Write-Warning "No ELIXAR_SIGNING_KEY secret: this release can't be installed by Elixar's updater (people download it by hand)."; exit 0 }
          $rsa = [System.Security.Cryptography.RSA]::Create()
          $rsa.FromXmlString($env:ELIXAR_SIGNING_KEY)
          $sig = $rsa.SignData([IO.File]::ReadAllBytes("elixar-manifest.txt"), [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)
          [IO.File]::WriteAllText("elixar-manifest.sig", [Convert]::ToBase64String($sig))
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = @("Elixar.zip", "elixar-manifest.txt")
          if (Test-Path elixar-manifest.sig) { $files += "elixar-manifest.sig" }
          if (Test-Path Elixar.msi) { $files += "Elixar.msi" }
          gh release create "$env:TAG" @files --title "Elixar $env:TAG" --target "${{ github.sha }}" --generate-notes
