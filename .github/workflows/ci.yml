# Every push and pull request: build Elixar on a real Windows PC in the cloud and run the full self-test as administrator.
name: Build and self-test
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the self-test
        shell: powershell
        # what went wrong is also written as annotations (shown on the run's page, readable without signing in)
        run: |
          $failed = $false
          try { .\build.ps1 -SelfTest *>&1 | Tee-Object -FilePath build-log.txt } catch { $_ | Out-String | Out-File -Append build-log.txt; $failed = $true }
          if ($failed -or -not $?) {
            $lines = Get-Content build-log.txt | Where-Object { $_ -match 'error|FAIL|Exception|failed|throw' } | Select-Object -First 40
            if (-not $lines) { $lines = Get-Content build-log.txt | Select-Object -Last 20 }
            foreach ($l in $lines) { Write-Host ("::error::" + ($l -replace '%','%25' -replace "`r",'' -replace "`n",' ')) }
            exit 1
          }
        env:
          ELIXAR_GOOGLE_ID: ${{ secrets.ELIXAR_GOOGLE_ID }}
          ELIXAR_GOOGLE_SECRET: ${{ secrets.ELIXAR_GOOGLE_SECRET }}
          ELIXAR_MS_ID: ${{ secrets.ELIXAR_MS_ID }}
          ELIXAR_SPONSOR: ${{ vars.ELIXAR_SPONSOR }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: out/selftest-report.txt
