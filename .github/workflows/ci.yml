# Every push and pull request: build Elixar on a real Windows PC in the cloud and run the full self-test as administrator.
name: Build and self-test
on:
  push:
    branches: [ main, 'preview/**' ]
  pull_request:
  workflow_dispatch:
# this build only reads the code: it can't change the repository or publish anything
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2, pinned to its commit
        with:
          persist-credentials: false   # the job's token isn't left in .git/config for later steps
      - name: Build and run the self-test
        shell: powershell
        # what went wrong is also written as annotations (shown on the run's page, readable without signing in)
        run: |
          $failed = $false
          try { .\build.ps1 -SelfTest *>&1 | Tee-Object -FilePath build-log.txt } catch { $_ | Out-String | Out-File -Append build-log.txt; $failed = $true }
          if ($failed -or -not $?) {
            # every failed check (and compile errors) in one annotation: GitHub shows at most 10 per step
            $log = Get-Content build-log.txt
            $fails = $log | Where-Object { $_ -match '^FAIL|error CS|Exception|RESULT' }
            if (-not $fails) { $fails = $log | Select-Object -Last 25 }
            $text = ($fails | Select-Object -First 80) -join "`n"
            Write-Host ("::error title=Failed checks::" + ($text -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'))
            # the lines just after each FAIL often say why
            $why = @(); for ($i = 0; $i -lt $log.Count; $i++) { if ($log[$i] -match '^FAIL') { $why += $log[$i]; $why += ($log[($i+1)..([Math]::Min($i+4, $log.Count-1))] | Where-Object { $_ -match '^\s' }) } }
            if ($why) { Write-Host ("::error title=Details::" + ((($why | Select-Object -First 150) -join "`n") -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')) }
            # the whole self-test report
            $reps = @('out\selftest-report.txt', 'out\business\selftest-report.txt') | Where-Object { Test-Path $_ }
            if ($reps) {
              $all = ($reps | ForEach-Object { "== $_"; Get-Content $_ }) -join "`n"
              # GitHub keeps 4 KB of each annotation and 10 notices per step
              for ($k = 0; $k -lt [Math]::Min($all.Length, 39000); $k += 3900) {
                $part = $all.Substring($k, [Math]::Min(3900, $all.Length - $k))
                Write-Host ("::notice title=Self-test report part " + ($k / 3900 + 1) + "::" + ($part -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'))
              }
            }
            # a crash: Windows keeps the .NET error with its stack in the Application log (one annotation, newlines as %0A)
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = '.NET Runtime' } -MaxEvents 2 -ErrorAction SilentlyContinue | ForEach-Object {
              $m = $_.Message; if ($m.Length -gt 6000) { $m = $m.Substring(0, 6000) }
              Write-Host ("::error title=.NET crash::" + ($m -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'))
            }
            exit 1
          }
        env:
          ELIXAR_GOOGLE_ID: ${{ secrets.ELIXAR_GOOGLE_ID }}
          ELIXAR_GOOGLE_SECRET: ${{ secrets.ELIXAR_GOOGLE_SECRET }}
          ELIXAR_MS_ID: ${{ secrets.ELIXAR_MS_ID }}
          ELIXAR_SPONSOR: ${{ vars.ELIXAR_SPONSOR }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v4.6.2, pinned to its commit
        with:
          name: selftest-report
          path: |
            out/selftest-report.txt
            out/business/selftest-report.txt
