name: Cleaner comparison

# Elixar next to Windows' Disk Cleanup, BleachBit and CCleaner Free, each on its own fresh Windows PC with the same junk.
on:
  workflow_dispatch:
  push:
    branches: ["cleaner-compare/**"]

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        tool: [none, elixar, elixar-ticked, diskcleanup, bleachbit, ccleaner]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned to its commit
      - name: Clean with ${{ matrix.tool }} and measure
        shell: pwsh
        run: ./tools/cleaner-compare.ps1 -Tool ${{ matrix.tool }}
